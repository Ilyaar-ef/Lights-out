<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Красные огни</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Russo+One&display=swap">
<style>
/* Layout: one tall tap stage under a start-light gantry, a compact stats strip below. Single dark look, like a pit wall at night. */
:root {
  --bg: #0c0d10;
  --panel: #14161b;
  --panel-edge: #262a33;
  --fg: #eceef2;
  --muted: #8b92a1;
  --lamp-off: #2a1719;
  --lamp-on: #ff2a1d;
  --lamp-glow: rgba(255, 42, 29, 0.55);
  --good: #3ddc84;
  --warn: #ffb020;
  --p1: #ff3b30;
  --p2: #ffc21a;
  --p3: #34d058;
  --p4: #22d3ee;
  --p5: #4c8dff;
  --p6: #e040fb;
  --font-display: "Russo One", "Arial Black", Impact, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-data);
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.tag { font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

.stage {
  all: unset;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 28px;
  min-height: min(68svh, 560px);
  padding: 22px 16px 24px;
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  cursor: pointer;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
}
.stage:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.stage.is-go { border-color: var(--good); }
.stage.is-false { border-color: var(--warn); }

.gantry { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(6px, 2.5vw, 14px); }
.col {
  display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 2vw, 10px);
  padding: clamp(8px, 2.4vw, 12px) 0;
  background: #090a0c;
  border: 1px solid var(--panel-edge);
  border-radius: 8px;
}
.lamp {
  width: min(11vw, 52px); aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #3a2023, var(--lamp-off) 70%);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.7);
}
.col.lit .lamp {
  background: radial-gradient(circle at 35% 30%, #ff8a7e, var(--lamp-on) 55%, #c4150b);
  box-shadow: 0 0 22px 5px var(--lamp-glow), inset 0 -3px 6px rgba(0, 0, 0, 0.25);
}

.readout { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.big { font-family: var(--font-display); font-size: clamp(2.2rem, 11vw, 3.6rem); line-height: 1.05; margin: 0; text-wrap: balance; font-variant-numeric: tabular-nums; }
.big small { font-size: 0.4em; color: var(--muted); margin-left: 0.2em; }
.sub { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.5; max-width: 32ch; text-wrap: balance; }
.verdict { margin: 0; font-size: 0.8rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--good); }
.is-false .big { color: var(--warn); }
.is-go .big { color: var(--good); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 8px; padding: 12px; min-width: 0; }
.stat dt { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
.stat dd { margin: 0; font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat dd.best { color: var(--good); }

.laps { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.laps li { display: grid; grid-template-columns: 2.2rem 1fr 4.6rem; align-items: center; gap: 10px; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
.laps .n { color: var(--muted); }
.laps .bar { height: 8px; background: #1c1f26; border-radius: 4px; overflow: hidden; }
.laps .bar i { display: block; height: 100%; background: var(--fg); border-radius: 4px; }
.laps .bar i.bad { background: var(--warn); }
.laps .t { text-align: right; }
.laps-title { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.empty { color: var(--muted); font-size: 0.8rem; margin: 0; }
.mode { display: flex; flex-direction: column; gap: 18px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; }
.tab {
  all: unset; box-sizing: border-box; text-align: center; padding: 11px 8px; border-radius: 7px;
  font-family: var(--font-data); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); cursor: pointer; touch-action: manipulation;
}
.tab[aria-pressed="true"] { background: var(--fg); color: var(--bg); font-weight: 600; }
.tab:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }

.panel { display: flex; min-height: 150px; padding: 22px 16px; background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; }
.panel .readout { flex: 1; }
.pads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pad {
  all: unset; box-sizing: border-box; display: flex; align-items: flex-end; min-height: clamp(96px, 28vw, 150px); padding: 10px;
  border-radius: 10px; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;
  font-family: var(--font-data); font-size: 0.7rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  background: var(--panel); border: 1px solid var(--panel-edge);
  background: color-mix(in srgb, var(--c) 12%, var(--panel));
  border-color: color-mix(in srgb, var(--c) 28%, var(--panel-edge));
}
.pad.on {
  background: var(--c); border-color: var(--c); color: var(--bg); font-weight: 600;
  box-shadow: 0 0 30px 4px color-mix(in srgb, var(--c) 55%, transparent);
}
.pad:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.go {
  all: unset; box-sizing: border-box; text-align: center; padding: 15px; border-radius: 10px;
  background: var(--fg); color: var(--bg); font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.04em;
  cursor: pointer; touch-action: manipulation;
}
.go:disabled { opacity: 0.4; cursor: default; }
.switch {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px; cursor: pointer;
}
.switch span { display: flex; flex-direction: column; gap: 3px; min-width: 0; font-size: 0.85rem; }
.switch small { color: var(--muted); font-size: 0.72rem; }
.switch input {
  appearance: none; -webkit-appearance: none; flex: none; position: relative; margin: 0; width: 46px; height: 26px;
  border-radius: 13px; background: #1c1f26; border: 1px solid var(--panel-edge); cursor: pointer;
}
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--muted); }
.switch input:checked { background: var(--good); border-color: var(--good); }
.switch input:checked::after { left: 22px; background: var(--bg); }
.switch input:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.go:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
@media (prefers-reduced-motion: no-preference) {
  .stage { transition: border-color 0.12s; }
}
</style>

<div class="wrap">
  <header>
    <h1>Красные огни</h1>
    <span class="tag">тест реакции</span>
  </header>

  <div class="tabs" role="group" aria-label="Режим">
    <button class="tab" type="button" data-mode="lights" aria-pressed="true">Огни</button>
    <button class="tab" type="button" data-mode="colors" aria-pressed="false">Цвета</button>
  </div>

  <div class="mode" id="mode-lights">
  <button class="stage" id="stage" type="button" aria-describedby="status">
    <div class="gantry" id="gantry" aria-hidden="true">
      <div class="col"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
      <div class="col"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
      <div class="col"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
      <div class="col"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
      <div class="col"><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i><i class="lamp"></i></div>
    </div>
    <div class="readout" id="status" aria-live="polite">
      <p class="big" id="big">Старт</p>
      <p class="sub" id="sub">Нажми на экран. Когда все пять огней погаснут, жми как можно быстрее.</p>
    </div>
  </button>

  <dl class="stats">
    <div class="stat"><dt>Лучший</dt><dd class="best" id="best">—</dd></div>
    <div class="stat"><dt>Среднее</dt><dd id="avg">—</dd></div>
    <div class="stat"><dt>Попытки</dt><dd id="count">0</dd></div>
  </dl>

  <section>
    <h2 class="laps-title">Последние круги</h2>
    <ol class="laps" id="laps"><li class="empty" style="display:block">Пока пусто. Первый заезд за тобой.</li></ol>
  </section>
  </div>

  <div class="mode" id="mode-colors" hidden>
    <div class="panel">
      <div class="readout" aria-live="polite">
        <p class="big" id="c-big">10 кругов</p>
        <p class="sub" id="c-sub">Одна из шести кнопок загорится. Нажимай именно её, как можно быстрее.</p>
      </div>
    </div>
    <div class="pads" id="pads">
      <button class="pad" type="button" style="--c: var(--p1)">Красный</button>
      <button class="pad" type="button" style="--c: var(--p2)">Жёлтый</button>
      <button class="pad" type="button" style="--c: var(--p3)">Зелёный</button>
      <button class="pad" type="button" style="--c: var(--p4)">Голубой</button>
      <button class="pad" type="button" style="--c: var(--p5)">Синий</button>
      <button class="pad" type="button" style="--c: var(--p6)">Розовый</button>
    </div>
    <label class="switch" for="c-instant">
      <span>Сразу следующий цвет<small>После верного нажатия новый цвет загорается без паузы</small></span>
      <input type="checkbox" id="c-instant">
    </label>
    <button class="go" id="c-start" type="button">Начать</button>
    <dl class="stats">
      <div class="stat"><dt>Лучший</dt><dd class="best" id="c-best">—</dd></div>
      <div class="stat"><dt>Среднее</dt><dd id="c-avg">—</dd></div>
      <div class="stat"><dt>Промахи</dt><dd id="c-miss">0</dd></div>
    </dl>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var cols = document.querySelectorAll('#gantry .col');
  var big = document.getElementById('big');
  var sub = document.getElementById('sub');
  var bestEl = document.getElementById('best');
  var avgEl = document.getElementById('avg');
  var countEl = document.getElementById('count');
  var lapsEl = document.getElementById('laps');

  var state = 'idle';       // idle | arming | waiting | go | result | false
  var timers = [];
  var goAt = 0;
  var results = [];         // valid reaction times, ms
  var attempts = 0;
  var best = null;

  try {
    var saved = parseInt(localStorage.getItem('redlights-best'), 10);
    if (saved > 0) best = saved;
  } catch (e) {}

  function clearTimers() { timers.forEach(clearTimeout); timers = []; }
  function lights(n) { cols.forEach(function (c, i) { c.classList.toggle('lit', i < n); }); }
  function setStage(cls) {
    stage.classList.remove('is-go', 'is-false');
    if (cls) stage.classList.add(cls);
  }
  function say(title, text, verdict) {
    big.innerHTML = title;
    sub.textContent = text || '';
    var old = document.getElementById('verdict');
    if (old) old.remove();
    if (verdict) {
      var v = document.createElement('p');
      v.className = 'verdict'; v.id = 'verdict'; v.textContent = verdict;
      big.insertAdjacentElement('afterend', v);
    }
  }
  function rate(ms) {
    if (ms <= 200) return 'Уровень пилота';
    if (ms <= 250) return 'Быстрая реакция';
    if (ms <= 320) return 'Нормально';
    return 'Можно быстрее';
  }

  function begin() {
    clearTimers();
    state = 'arming';
    setStage(null);
    lights(0);
    say('Приготовься', 'Огни загораются по одному.');
    var lit = 0;
    (function step() {
      timers.push(setTimeout(function () {
        lit += 1;
        lights(lit);
        if (lit < 5) { step(); }
        else {
          state = 'waiting';
          say('Жди…', 'Нажмёшь раньше времени, будет фальстарт.');
          var hold = 400 + Math.random() * 2600;
          timers.push(setTimeout(function () {
            lights(0);
            requestAnimationFrame(function () {
              if (state !== 'waiting') return;
              goAt = performance.now();
              state = 'go';
              setStage('is-go');
              say('Жми!', '');
            });
          }, hold));
        }
      }, 850));
    })();
  }

  function falseStart() {
    clearTimers();
    state = 'false';
    attempts += 1;
    lights(0);
    setStage('is-false');
    say('Фальстарт', 'Огни ещё горели. Нажми, чтобы повторить.');
    render();
  }

  function react(ts) {
    var ms = Math.max(1, Math.round(ts - goAt));
    state = 'result';
    attempts += 1;
    results.push(ms);
    var isBest = best === null || ms < best;
    if (isBest) {
      best = ms;
      try { localStorage.setItem('redlights-best', String(ms)); } catch (e) {}
    }
    setStage(null);
    say(ms + '<small>мс</small>', 'Нажми, чтобы ещё раз.', isBest ? 'Новый рекорд' : rate(ms));
    render();
  }

  function render() {
    bestEl.textContent = best === null ? '—' : best + ' мс';
    countEl.textContent = String(attempts);
    if (results.length) {
      var sum = results.reduce(function (a, b) { return a + b; }, 0);
      avgEl.textContent = Math.round(sum / results.length) + ' мс';
    } else { avgEl.textContent = '—'; }

    var last = results.slice(-5).reverse();
    var startIdx = results.length;
    if (!last.length) return;
    lapsEl.innerHTML = '';
    last.forEach(function (ms, i) {
      var li = document.createElement('li');
      var n = document.createElement('span'); n.className = 'n'; n.textContent = '#' + (startIdx - i);
      var bar = document.createElement('span'); bar.className = 'bar';
      var fill = document.createElement('i');
      var pct = Math.min(100, Math.max(6, (ms / 600) * 100));
      fill.style.width = pct + '%';
      if (ms > 400) fill.className = 'bad';
      bar.appendChild(fill);
      var t = document.createElement('span'); t.className = 't'; t.textContent = ms + ' мс';
      li.appendChild(n); li.appendChild(bar); li.appendChild(t);
      lapsEl.appendChild(li);
    });
  }

  function onPress(e) {
    var ts = (e && e.timeStamp) ? e.timeStamp : performance.now();
    if (state === 'idle' || state === 'result' || state === 'false') begin();
    else if (state === 'arming' || state === 'waiting') falseStart();
    else if (state === 'go') react(ts);
  }

  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    onPress(e);
  });
  stage.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      if (!e.repeat) onPress(e);
    }
  });
  stage.addEventListener('click', function (e) { e.preventDefault(); });

  document.addEventListener('modechange', function (e) {
    if (e.detail === 'lights') return;
    clearTimers();
    state = 'idle';
    lights(0);
    setStage(null);
    say('Старт', 'Нажми на экран. Когда все пять огней погаснут, жми как можно быстрее.');
  });

  render();
})();

(function () {
  var ROUNDS = 10;
  var pads = Array.prototype.slice.call(document.querySelectorAll('#pads .pad'));
  var cBig = document.getElementById('c-big');
  var cSub = document.getElementById('c-sub');
  var startBtn = document.getElementById('c-start');
  var bestEl = document.getElementById('c-best');
  var avgEl = document.getElementById('c-avg');
  var missEl = document.getElementById('c-miss');

  var running = false, lit = -1, last = -1, litAt = 0, round = 0;
  var times = [], misses = 0, timer = null, best = null;

  try {
    var saved = parseInt(localStorage.getItem('redlights-pads-best'), 10);
    if (saved > 0) best = saved;
  } catch (e) {}

  var instant = document.getElementById('c-instant');
  try { instant.checked = localStorage.getItem('redlights-instant') === '1'; } catch (e) {}
  instant.addEventListener('change', function () {
    try { localStorage.setItem('redlights-instant', instant.checked ? '1' : '0'); } catch (e) {}
  });

  function setOn(i) { pads.forEach(function (p, k) { p.classList.toggle('on', k === i); }); }
  function roundText() { return 'Круг ' + (round + 1) + ' из ' + ROUNDS + '.'; }

  function stats() {
    bestEl.textContent = best === null ? '—' : best + ' мс';
    missEl.textContent = String(misses);
    if (times.length) {
      var sum = times.reduce(function (a, b) { return a + b; }, 0);
      avgEl.textContent = Math.round(sum / times.length) + ' мс';
    } else { avgEl.textContent = '—'; }
  }

  function wait(afterHit) {
    clearTimeout(timer);
    lit = -1;
    setOn(-1);
    var delay = (afterHit && instant.checked) ? 0 : 700 + Math.random() * 1800;
    timer = setTimeout(light, delay);
  }

  function light() {
    var i;
    do { i = Math.floor(Math.random() * pads.length); } while (i === last);
    last = i;
    setOn(i);
    requestAnimationFrame(function () {
      if (!running) return;
      litAt = performance.now();
      lit = i;
      cBig.textContent = 'Жми!';
    });
  }

  function finish() {
    running = false;
    clearTimeout(timer);
    lit = -1;
    setOn(-1);
    var sum = times.reduce(function (a, b) { return a + b; }, 0);
    var avg = Math.round(sum / times.length);
    cBig.innerHTML = avg + '<small>мс</small>';
    cSub.textContent = 'Среднее за ' + ROUNDS + ' кругов. Промахов: ' + misses + '.';
    startBtn.disabled = false;
    startBtn.textContent = 'Ещё раз';
    stats();
  }

  function begin() {
    running = true;
    round = 0; times = []; misses = 0; last = -1;
    startBtn.disabled = true;
    startBtn.textContent = 'Идёт заезд…';
    cBig.textContent = 'Жди…';
    cSub.textContent = roundText();
    stats();
    wait();
  }

  function press(i, e) {
    if (!running) return;
    if (lit < 0) {
      misses += 1;
      cBig.textContent = 'Рано';
      cSub.textContent = roundText() + ' Огонь ещё не загорелся, ожидание начато заново.';
      stats();
      wait();
      return;
    }
    if (i !== lit) {
      misses += 1;
      cSub.textContent = roundText() + ' Не та кнопка, ищи горящую.';
      stats();
      return;
    }
    var ts = (e && e.timeStamp) ? e.timeStamp : performance.now();
    var ms = Math.max(1, Math.round(ts - litAt));
    times.push(ms);
    if (best === null || ms < best) {
      best = ms;
      try { localStorage.setItem('redlights-pads-best', String(ms)); } catch (err) {}
    }
    round += 1;
    stats();
    if (round >= ROUNDS) { finish(); return; }
    cBig.innerHTML = ms + '<small>мс</small>';
    cSub.textContent = roundText();
    wait(true);
  }

  pads.forEach(function (p, i) {
    p.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      e.preventDefault();
      press(i, e);
    });
    p.addEventListener('keydown', function (e) {
      if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); press(i, e); }
    });
    p.addEventListener('click', function (e) { e.preventDefault(); });
  });
  startBtn.addEventListener('click', begin);

  document.addEventListener('modechange', function (e) {
    if (e.detail === 'colors') return;
    running = false;
    clearTimeout(timer);
    lit = -1;
    setOn(-1);
    startBtn.disabled = false;
    startBtn.textContent = 'Начать';
    cBig.textContent = ROUNDS + ' кругов';
    cSub.textContent = 'Одна из шести кнопок загорится. Нажимай именно её, как можно быстрее.';
  });

  stats();
})();

(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
  var panes = {
    lights: document.getElementById('mode-lights'),
    colors: document.getElementById('mode-colors')
  };
  function show(mode) {
    Object.keys(panes).forEach(function (k) { panes[k].hidden = k !== mode; });
    tabs.forEach(function (t) { t.setAttribute('aria-pressed', t.getAttribute('data-mode') === mode ? 'true' : 'false'); });
    document.dispatchEvent(new CustomEvent('modechange', { detail: mode }));
  }
  tabs.forEach(function (t) {
    t.addEventListener('click', function () {
      if (t.getAttribute('aria-pressed') === 'true') return;
      show(t.getAttribute('data-mode'));
    });
  });
})();
</script>

</body></html>
